name: Validate handoff manifest

on:
  pull_request:
    paths:
      - "handoffs/HANDOFF_MANIFEST.md"
      - "handoffs/index.json"
      - "handoffs/active_supervision.json"
      - "scripts/validate_handoff_manifest.py"
      - "scripts/build_handoff_index.py"
      - "scripts/tests/test_validate_handoff_manifest*.py"
      - "scripts/tests/test_build_handoff_index.py"
      - ".github/workflows/validate-handoff-manifest.yml"
  push:
    branches:
      - main
    paths:
      - "handoffs/HANDOFF_MANIFEST.md"
      - "handoffs/index.json"
      - "handoffs/active_supervision.json"
      - "scripts/validate_handoff_manifest.py"
      - "scripts/build_handoff_index.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # `requests` is imported by scripts/check_sophia_stalled.py, which
        # scripts/tests/ collects. Without it collection aborts and the whole
        # suite errors out (this step had been red on main regardless of PR).
        run: pip install pytest requests
      - name: Run validator against the committed manifest
        run: python3 scripts/validate_handoff_manifest.py
      - name: Check handoffs/index.json is in sync with the manifest
        run: python3 scripts/validate_handoff_manifest.py --check-index
      - name: Scope the supervision check to PRs that can affect claims
        id: scope
        # Only THIS repo's active_supervision.json state belongs to the supervisor.
        # An unrelated manifest row addition must not be gated by the supervisor's
        # board being dirty (main was red for weeks that way, blocking every PR).
        # Fail OPEN: when the file list cannot be determined we still run the check.
        # This workflow file is deliberately NOT in the trigger list: editing the gate
        # must not require the gate to be green, or a broken gate can never be fixed
        # (bootstrap). Pushes to main still always run it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=run
          num='${{ github.event.pull_request.number }}'
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/$num/files" \
                      --paginate --jq '.[].filename' 2>/dev/null || true)
            count=$(printf '%s\n' "$files" | grep -c . || true)
            if [ "$count" -gt 0 ] && [ "$count" -lt 300 ]; then
              touching=$(printf '%s\n' "$files" | grep -cE \
                '^(handoffs/active_supervision\.json|scripts/validate_handoff_manifest\.py|scripts/build_handoff_index\.py)$' || true)
              if [ "$touching" -eq 0 ]; then run=skip; fi
            fi
          fi
          echo "supervision=$run" >> "$GITHUB_OUTPUT"
          echo "supervision gate: $run"

      - name: Cross-check active_supervision.json against the manifest
        if: steps.scope.outputs.supervision != 'skip'
        run: python3 scripts/validate_handoff_manifest.py --check-supervision
      - name: Run unit + integration tests
        run: python3 -m pytest scripts/tests/ -v
